spring.application.name=InterledgerPaymentService

server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
spring.datasource.username=${DB_USERNAME:payment_user}
spring.datasource.password=${DB_PASSWORD:local_dev_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.error.include-message=never

